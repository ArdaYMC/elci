<text class="title" x="500.0" y="23" text-anchor="middle">elçi · three agents, one person</text>
<text class="l cmd" x="24" y="64" xml:space="preserve" style="animation:k0 25.7s linear infinite">$ python examples/three_agents.py --yes</text>
<text class="l step" x="24" y="85" xml:space="preserve" style="animation:k1 25.7s linear infinite">1) Marka ajanı devbyarda&#x27;ya iş birliği teklif ediyor (HTTP, imzalı, yetki belgeli)</text>
<text class="l step" x="24" y="106" xml:space="preserve" style="animation:k2 25.7s linear infinite">2) devbyarda teklifi aldı, Jarvy&#x27;ye müsaitlik soruyor: [&#x27;2026-11-26T14:00&#x27;, &#x27;2026-11-27T11:00&#x27;]</text>
<text class="l step" x="24" y="127" xml:space="preserve" style="animation:k3 25.7s linear infinite">3) Jarvy tam kaydı verdi; devbyarda yalnızca şunu paylaşıyor: [{&#x27;slot&#x27;: &#x27;2026-11-26T14:00&#x27;, &#x27;busy&#x27;:</text>
<text class="l out" x="24" y="148" xml:space="preserve" style="animation:k4 25.7s linear infinite">   True}, {&#x27;slot&#x27;: &#x27;2026-11-27T11:00&#x27;, &#x27;busy&#x27;: False}]</text>
<text class="l ok" x="24" y="169" xml:space="preserve" style="animation:k5 25.7s linear infinite">   [ONAY / APPROVAL] Arda&#x27;ya soruluyor: Brand Co. ile iş birliği, 2026-11-27T11:00</text>
<text class="l ok" x="24" y="190" xml:space="preserve" style="animation:k6 25.7s linear infinite">   [ONAY] verildi, imzalı makbuz eklendi</text>
<text class="l dim" x="24" y="211" xml:space="preserve" style="animation:k7 25.7s linear infinite">   teslim durumu: 202</text>
<text class="l step" x="24" y="232" xml:space="preserve" style="animation:k8 25.7s linear infinite">4) Marka tarafına ulaşan mesajlar: [&#x27;answer&#x27;, &#x27;accept&#x27;]</text>
<text class="l step" x="24" y="253" xml:space="preserve" style="animation:k9 25.7s linear infinite"></text>
<text class="l step" x="24" y="274" xml:space="preserve" style="animation:k10 25.7s linear infinite">5) acme-work, ajanı olmayan tedarikçiye e-postayla ulaşıyor</text>
<text class="l dim" x="24" y="295" xml:space="preserve" style="animation:k11 25.7s linear infinite">   --- giden e-posta ---</text>
<text class="l out" x="24" y="316" xml:space="preserve" style="animation:k12 25.7s linear infinite">   Merhaba / Hello,</text>
<text class="l out" x="24" y="337" xml:space="preserve" style="animation:k13 25.7s linear infinite">   </text>
<text class="l out" x="24" y="358" xml:space="preserve" style="animation:k14 25.7s linear infinite">   Acme Elektronik sizinle şu konuda iletişime geçmek istiyor / would like to reach you about:</text>
<text class="l out" x="24" y="379" xml:space="preserve" style="animation:k15 25.7s linear infinite">      scheduling.</text>
<text class="l out" x="24" y="400" xml:space="preserve" style="animation:k16 25.7s linear infinite">   </text>
<text class="l out" x="24" y="421" xml:space="preserve" style="animation:k17 25.7s linear infinite">   Aralık siparişi için kısa bir görüşme</text>
<text class="l out" x="24" y="442" xml:space="preserve" style="animation:k18 25.7s linear infinite">   </text>
<text class="l out" x="24" y="463" xml:space="preserve" style="animation:k19 25.7s linear infinite">   Seçenekler / Options:</text>
<text class="l out" x="24" y="484" xml:space="preserve" style="animation:k20 25.7s linear infinite">     1. 2026-12-01 10:00</text>
<text class="l out" x="24" y="505" xml:space="preserve" style="animation:k21 25.7s linear infinite">     2. 2026-12-02 15:00</text>
<text class="l out" x="24" y="526" xml:space="preserve" style="animation:k22 25.7s linear infinite">   </text>
<text class="l out" x="24" y="547" xml:space="preserve" style="animation:k23 25.7s linear infinite">   Uygun olanın numarasıyla cevap verin, ya da &quot;hayır&quot; yazın. / Reply with the number that suits</text>
<text class="l out" x="24" y="568" xml:space="preserve" style="animation:k24 25.7s linear infinite">      you, or &quot;no&quot;.</text>
<text class="l out" x="24" y="589" xml:space="preserve" style="animation:k25 25.7s linear infinite">   </text>
<text class="l out" x="24" y="610" xml:space="preserve" style="animation:k26 25.7s linear infinite">   --</text>
<text class="l out" x="24" y="631" xml:space="preserve" style="animation:k27 25.7s linear infinite">   Bu e-postayı Acme Elektronik adına bir asistan gönderdi; cevabınızı Acme Elektronik onaylayacak.</text>
<text class="l out" x="24" y="652" xml:space="preserve" style="animation:k28 25.7s linear infinite">   Sent by an assistant on behalf of Acme Elektronik; Acme Elektronik confirms every answer.</text>
<text class="l out" x="24" y="673" xml:space="preserve" style="animation:k29 25.7s linear infinite">   elci-thread: thr_44dfd7273b19</text>
<text class="l out" x="24" y="694" xml:space="preserve" style="animation:k30 25.7s linear infinite">   </text>
<text class="l step" x="24" y="715" xml:space="preserve" style="animation:k31 25.7s linear infinite">6) Cevap ayrıştırıldı: seçenek=2, thread=thr_44dfd7273b19, onay gerekli=True</text>
<text class="l ok" x="24" y="736" xml:space="preserve" style="animation:k32 25.7s linear infinite">   [ONAY / APPROVAL] Arda&#x27;ya soruluyor: Tedarikçi görüşmesi 2026-12-02 15:00</text>
<text class="l ok" x="24" y="757" xml:space="preserve" style="animation:k33 25.7s linear infinite">   [ONAY] verildi, imzalı makbuz eklendi</text>
<text class="l step" x="24" y="778" xml:space="preserve" style="animation:k34 25.7s linear infinite">7) Jarvy takvime işledi. Bitti.</text>
