<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" role="img" aria-label="Elçi message flow: proposal, need-to-know answer, human approval, verified accept">
<style>
  :root{--bg:#FBFAF7;--card:#FFFFFF;--ink:#14213D;--muted:#5B6475;--line:#D9D4C7;--accent:#D97A1E;--accent-soft:#FBEBD9;--ok:#1F7A57;--ok-soft:#DDF1E7;--priv:#6B5BD6;--priv-soft:#ECE9FB}
  @media (prefers-color-scheme: dark){:root{--bg:#0D1117;--card:#161B22;--ink:#E6EDF3;--muted:#9DA7B3;--line:#30363D;--accent:#F2A541;--accent-soft:#3A2A14;--ok:#3FB950;--ok-soft:#12261B;--priv:#A898FF;--priv-soft:#221D3D}}
  text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .muted{fill:var(--muted)}
</style>

  <defs>
    <marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker>
    <marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--ok)"/></marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
    <marker id="m-priv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--priv)"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="808" rx="20" style="fill:var(--bg);stroke:var(--line)" stroke-width="2"/>
  <line x1="160" y1="112" x2="160" y2="760" style="stroke:var(--line)" stroke-width="2" stroke-dasharray="4 6"/>
  <rect x="45" y="32" width="230" height="74" rx="14" style="fill:var(--card);stroke:var(--ok)" stroke-width="2.5"/>
  <text x="160" y="64" text-anchor="middle" font-size="19" font-weight="800">Brand Co. agent</text>
  <text x="160" y="89" text-anchor="middle" font-size="13" class="muted">brand.example</text>
  <line x1="480" y1="112" x2="480" y2="760" style="stroke:var(--line)" stroke-width="2" stroke-dasharray="4 6"/>
  <rect x="365" y="32" width="230" height="74" rx="14" style="fill:var(--card);stroke:var(--accent)" stroke-width="2.5"/>
  <text x="480" y="64" text-anchor="middle" font-size="19" font-weight="800">devbyarda</text>
  <text x="480" y="89" text-anchor="middle" font-size="13" class="muted">Arda's creator agent</text>
  <line x1="800" y1="112" x2="800" y2="760" style="stroke:var(--line)" stroke-width="2" stroke-dasharray="4 6"/>
  <rect x="685" y="32" width="230" height="74" rx="14" style="fill:var(--card);stroke:var(--priv)" stroke-width="2.5"/>
  <text x="800" y="64" text-anchor="middle" font-size="19" font-weight="800">Jarvy</text>
  <text x="800" y="89" text-anchor="middle" font-size="13" class="muted">Arda's private coordinator</text>
  <line x1="1070" y1="112" x2="1070" y2="760" style="stroke:var(--line)" stroke-width="2" stroke-dasharray="4 6"/>
  <rect x="955" y="32" width="230" height="74" rx="14" style="fill:var(--card);stroke:var(--ink)" stroke-width="2.5"/>
  <text x="1070" y="64" text-anchor="middle" font-size="19" font-weight="800">Arda</text>
  <text x="1070" y="89" text-anchor="middle" font-size="13" class="muted">the human</text>
  <line x1="166" y1="170" x2="472" y2="170" style="stroke:var(--ok)" stroke-width="2.5" marker-end="url(#m-ok)"/>
  <text x="320.0" y="160" text-anchor="middle" font-size="15" font-weight="700">propose: Wed 14:00 or Thu 11:00?</text>
  <text x="320.0" y="192" text-anchor="middle" font-size="13" class="muted">signed, with a delegation token</text>
  <circle cx="174" cy="154" r="11" style="fill:var(--ok)"/><text x="174" y="158.5" text-anchor="middle" font-size="12" font-weight="800" style="fill:var(--bg)">1</text>
  <rect x="494" y="196" width="300" height="48" rx="10" style="fill:var(--accent-soft);stroke:var(--accent)" stroke-width="1.5"/>
  <text x="508" y="220" font-size="13" >Inbox checks: card, domain, freshness,</text>
  <text x="508" y="240" font-size="13" >signature, mandate, replay</text>
  <line x1="486" y1="290" x2="792" y2="290" style="stroke:var(--priv)" stroke-width="2.5" marker-end="url(#m-priv)"/>
  <text x="640.0" y="280" text-anchor="middle" font-size="15" font-weight="700">availability for these slots?</text>
  <circle cx="494" cy="274" r="11" style="fill:var(--priv)"/><text x="494" y="278.5" text-anchor="middle" font-size="12" font-weight="800" style="fill:var(--bg)">2</text>
  <line x1="794" y1="360" x2="488" y2="360" style="stroke:var(--priv)" stroke-width="2.5" marker-end="url(#m-priv)"/>
  <text x="640.0" y="350" text-anchor="middle" font-size="15" font-weight="700">Wed: busy, supplier meeting</text>
  <text x="640.0" y="382" text-anchor="middle" font-size="13" class="muted">Thu: free (the full record)</text>
  <circle cx="786" cy="344" r="11" style="fill:var(--priv)"/><text x="786" y="348.5" text-anchor="middle" font-size="12" font-weight="800" style="fill:var(--bg)">3</text>
  <rect x="330" y="402" width="300" height="48" rx="10" style="fill:var(--accent-soft);stroke:var(--accent)" stroke-width="1.5"/>
  <text x="344" y="426" font-size="13" >Need-to-know: redact to busy/free.</text>
  <text x="344" y="446" font-size="13" class="muted">The reason stays with Arda.</text>
  <line x1="474" y1="500" x2="168" y2="500" style="stroke:var(--ok)" stroke-width="2.5" marker-end="url(#m-ok)"/>
  <text x="320.0" y="490" text-anchor="middle" font-size="15" font-weight="700">answer: Wed busy, Thu free</text>
  <text x="320.0" y="522" text-anchor="middle" font-size="13" class="muted">no titles, no attendees</text>
  <circle cx="466" cy="484" r="11" style="fill:var(--ok)"/><text x="466" y="488.5" text-anchor="middle" font-size="12" font-weight="800" style="fill:var(--bg)">4</text>
  <line x1="486" y1="570" x2="1062" y2="570" style="stroke:var(--accent)" stroke-width="2.5" marker-end="url(#m-accent)"/>
  <text x="775.0" y="560" text-anchor="middle" font-size="15" font-weight="700">Accept Thu 11:00 with Brand Co.?</text>
  <circle cx="494" cy="554" r="11" style="fill:var(--accent)"/><text x="494" y="558.5" text-anchor="middle" font-size="12" font-weight="800" style="fill:var(--bg)">5</text>
  <line x1="1064" y1="640" x2="488" y2="640" style="stroke:var(--accent)" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#m-accent)"/>
  <text x="775.0" y="630" text-anchor="middle" font-size="15" font-weight="700">yes: signed receipt</text>
  <text x="775.0" y="662" text-anchor="middle" font-size="13" class="muted">covers this exact body (body_sha256)</text>
  <circle cx="1056" cy="624" r="11" style="fill:var(--accent)"/><text x="1056" y="628.5" text-anchor="middle" font-size="12" font-weight="800" style="fill:var(--bg)">6</text>
  <line x1="474" y1="720" x2="168" y2="720" style="stroke:var(--ok)" stroke-width="2.5" marker-end="url(#m-ok)"/>
  <text x="320.0" y="710" text-anchor="middle" font-size="15" font-weight="700">accept + approval receipt</text>
  <circle cx="466" cy="704" r="11" style="fill:var(--ok)"/><text x="466" y="708.5" text-anchor="middle" font-size="12" font-weight="800" style="fill:var(--bg)">7</text>
  <rect x="30" y="736" width="330" height="48" rx="10" style="fill:var(--ok-soft);stroke:var(--ok)" stroke-width="1.5"/>
  <text x="44" y="760" font-size="13" >Verified: Arda said yes, to this offer.</text>
  <text x="44" y="780" font-size="13" class="muted">An agent alone cannot accept.</text>
</svg>
