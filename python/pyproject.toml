[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elci"
version = "0.0.6"
description = "Reference implementation of Elçi, an open person-to-person agent protocol."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Arda Yemci" }]
dependencies = ["jsonschema>=4.18", "cryptography>=42"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
mcp = ["mcp>=2"]
dev = ["pytest>=8", "mcp>=2"]

[project.scripts]
elci-mcp = "elci.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ArdaYMC/elci"

[tool.hatch.build.targets.wheel]
packages = ["src/elci"]

[tool.hatch.build.targets.wheel.force-include]
"../spec/schemas" = "elci/schemas"
