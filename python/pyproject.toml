[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elci"
version = "0.2.0"
description = "Reference implementation of Elçi, an open person-to-person agent protocol."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Arda Yemci" }]
dependencies = ["jsonschema>=4.18", "cryptography>=42"]
keywords = ["ai-agents", "agent-protocol", "mcp", "a2a", "ed25519", "personal-ai", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
mcp = ["mcp>=2"]
dev = ["pytest>=8", "mcp>=2"]

[project.scripts]
elci = "elci.cli:main"
elci-mcp = "elci.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ArdaYMC/elci"
Specification = "https://github.com/ArdaYMC/elci/tree/main/spec"
Issues = "https://github.com/ArdaYMC/elci/issues"
Security = "https://github.com/ArdaYMC/elci/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/elci"]

[tool.hatch.build.targets.sdist]
include = ["src/elci", "README.md", "pyproject.toml"]
